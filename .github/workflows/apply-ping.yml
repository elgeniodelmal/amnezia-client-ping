name: Apply Ping Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check patch compatibility
        run: git apply --check amnezia-android-ping.patch

      - name: Apply patch
        run: git apply amnezia-android-ping.patch

      - name: Verify changes
        run: |
          git apply --reverse --check amnezia-android-ping.patch
          git diff --check
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add server ping functionality"
          git push
